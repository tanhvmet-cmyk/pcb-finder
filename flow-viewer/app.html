<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dòng điện trên schematic</title>
<style>
/* VOICE: công cụ kỹ thuật, nói tiếng Việt đơn giản
   IDEA: bàn soi bản vẽ mạch, dây sáng lên khi có dòng chạy
   PICTURE: chính trang schematic của người dùng, dòng điện chạy trên dây thật
   COLOUR and TYPE: giấy xám xanh, mực đen, xanh ngọc cho dòng điện; chữ hệ thống, nhãn linh kiện dạng mono
   LAYOUT: thanh trên, sơ đồ lớn bên trái, bảng điều khiển bên phải; điện thoại xếp dọc */
:root{color-scheme:light dark;
--bg:light-dark(#eef1ec,#0e1613);--paper:light-dark(#f8faf6,#131d19);--ink:light-dark(#17201c,#e3ebe6);--mut:light-dark(#5a6962,#94a79d);
--line:light-dark(#cfd8d1,#26352f);--acc:light-dark(#0790ae,#3fd3ee);--bad:light-dark(#c8402a,#ff7a63);--ok:light-dark(#2f8a4a,#6fdc8c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
button,input,select{font:inherit;color:inherit}
button{min-height:40px;padding:0 14px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-weight:600}
button:hover{border-color:var(--mut)}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=text],input[type=search],select{min-height:42px;padding:0 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;width:100%}
/* drop screen */
.drop{min-height:100%;display:grid;place-items:center;padding:24px}
.dz{width:min(680px,100%);text-align:center;border:2.5px dashed var(--line);border-radius:20px;padding:clamp(28px,6vw,60px) 24px;background:var(--paper);cursor:pointer;transition:border-color .2s,transform .2s}
.dz.over{border-color:var(--acc);transform:scale(1.01)}
.dz h1{font-size:clamp(26px,4.5vw,40px);line-height:1.08;margin:14px 0 8px;text-wrap:balance}
.dz p{color:var(--mut);margin:0 auto 18px;max-width:52ch}
.dz svg{width:min(320px,80%);height:auto}
.wire{fill:none;stroke:var(--mut);stroke-width:3;stroke-linejoin:round}
.wfl{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round;stroke-dasharray:3 13;animation:fl 1s linear infinite}
.prog{margin-top:16px;color:var(--acc);font-weight:600;min-height:24px}
.lim{color:var(--mut);font-size:13px;margin-top:18px}
/* app */
.app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.bar .nm{font-weight:700;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}
.bar select{width:auto;min-width:150px}
.zb{display:flex;gap:4px}.zb button{min-width:40px;padding:0 10px}
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.view{position:relative;overflow:hidden;background:var(--bg);touch-action:none;cursor:grab}
.view.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 2px 18px rgba(0,0,0,.18)}
#stage canvas,#stage img{position:absolute;inset:0;width:100%;height:100%}
#stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.side{border-left:1px solid var(--line);background:var(--paper);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:16px;margin:0 0 6px}
.card p{margin:0 0 8px;color:var(--mut);font-size:14px}
.row{display:flex;gap:6px}.row>input{flex:1}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);margin-top:8px;min-height:32px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.steps{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.steps li{font:600 13px ui-monospace,Consolas,monospace;padding:4px 8px;border-radius:7px;border:1.5px solid var(--line)}
.steps li.ok{border-color:var(--ok);color:var(--ok)}.steps li.no{border-color:var(--bad);color:var(--bad)}
.msg{font-size:13px;color:var(--bad);margin-top:6px}
.plist{display:flex;flex-direction:column;gap:6px}
.pi{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1.5px solid var(--line);border-radius:9px;cursor:pointer}
.pi.on{border-color:var(--ink)}
.pi i{width:14px;height:14px;border-radius:4px;flex:none}
.pi span{flex:1;font:600 13px ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi button{min-height:30px;padding:0 8px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chips button{min-height:32px;padding:0 9px;font:600 13px ui-monospace,Consolas,monospace}
.stat{font-size:13px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
/* overlay */
.hl{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.glow{stroke-width:11;opacity:.28}
.flow{stroke-width:4;stroke-dasharray:3 12;animation:fl var(--t,.7s) linear infinite}
.jump{stroke-width:2.5;stroke-dasharray:2 6;opacity:.9}
.ring{fill:none;stroke:var(--bad);stroke-width:3;vector-effect:non-scaling-stroke;animation:pulse 1.2s ease-out infinite}
.cbox{fill:none;stroke:var(--bad);stroke-width:2;vector-effect:non-scaling-stroke}
@keyframes fl{to{stroke-dashoffset:-30}}
@keyframes pulse{0%{opacity:1}100%{opacity:.15}}
@media(prefers-reduced-motion:reduce){.flow,.wfl{animation:none;stroke-dasharray:none}.ring{animation:none}}
@media(max-width:800px){.main{grid-template-columns:minmax(0,1fr);grid-template-rows:62vh auto}.side{border-left:0;border-top:1px solid var(--line);overflow:visible}.app{height:auto;min-height:100%}.bar .nm{max-width:100%;flex-basis:100%}}
</style>
</head>
<body>
<div class="drop" id="drop">
 <label class="dz" id="dz">
  <svg viewBox="0 0 320 120" aria-hidden="true"><path class="wire" d="M10 60 H90 M130 60 H190 M230 60 H310 M90 48 H130 V72 H90 Z M190 40 V80 M200 40 V80"/><path class="wfl" d="M10 60 H90 M130 60 H190 M200 60 H310"/></svg>
  <h1>Kéo file PDF schematic vào đây</h1>
  <p>Hoặc bấm để chọn file. Trang sẽ vẽ lại sơ đồ, bấm vào dây nào thì dây đó sáng lên, gõ chuỗi linh kiện thì dòng điện chạy theo đường đó.</p>
  <span class="mono" style="font-weight:600">Chọn file PDF</span>
  <input type="file" id="file" accept="application/pdf,.pdf" hidden>
  <div class="prog" id="prog"></div>
  <div class="lim">File được đọc ngay trên máy, không gửi đi đâu. Đọc tốt nhất với PDF vector (bôi đen chữ được), ví dụ PDF in từ Altium. Ảnh scan thì không đọc được dây.</div>
 </label>
</div>

<div class="app" id="app" hidden>
 <div class="bar">
  <span class="nm" id="nm"></span>
  <select id="pg" aria-label="Trang"></select>
  <div class="zb"><button id="zo" aria-label="Thu nhỏ">−</button><button id="zi" aria-label="Phóng to">+</button><button id="zf">Vừa màn hình</button></div>
  <button id="exp">Lưu HTML</button>
  <button id="new">Mở file khác</button>
 </div>
 <div class="main">
  <div class="view" id="view"><div id="stage"><canvas id="cv"></canvas><img id="im" alt="" hidden><svg id="ov"><g id="gnet"></g><g id="gpath"></g><g id="gmark"></g></svg></div></div>
  <aside class="side">
   <section class="card">
    <h2>Đường dòng điện</h2>
    <p>Gõ tên nhãn và linh kiện theo thứ tự dòng chạy, cách nhau bằng dấu cách.</p>
    <div class="row"><input type="text" id="seq" class="mono" placeholder="ví dụ: ACL F1 D1 C1 R1 D4 ACN" autocomplete="off" spellcheck="false"><button class="pri" id="go">Vẽ</button></div>
    <label class="chk"><input type="checkbox" id="pick" checked> Bấm linh kiện trên sơ đồ để thêm vào chuỗi</label>
    <ol class="steps" id="steps"></ol><div class="msg" id="msg"></div>
    <label class="chk">Tốc độ <input type="range" id="spd" min="1" max="5" value="3" style="flex:1;accent-color:var(--acc)"></label>
   </section>
   <section class="card"><h2>Các đường đã vẽ</h2><div class="plist" id="plist"><p>Chưa có đường nào.</p></div></section>
   <section class="card">
    <h2>Tìm linh kiện / nhãn</h2>
    <input type="search" id="q" class="mono" placeholder="R12, C5, VCC…" autocomplete="off" spellcheck="false">
    <div class="chips" id="hits"></div>
   </section>
   <section class="card"><h2 id="it">Thông tin</h2><div id="info"><p>Bấm vào một dây trên sơ đồ để xem cả net của nó.</p></div></section>
   <div class="stat" id="stat"></div>
  </aside>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>/*PDFJS*/</script>
<script type="text/plain" id="wk">/*WORKER*/</script>
<script>
{
const SRC=(()=>{const c=document.documentElement.cloneNode(true);const p=c.querySelector('#preload');if(p)p.remove();return '<!DOCTYPE html>\n'+c.outerHTML;})();
const $=id=>document.getElementById(id);
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),2600);};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lib=window.pdfjsLib;
if(lib){try{lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([$('wk').textContent],{type:'text/javascript'}));}catch(e){}}

// ---------- text rules ----------
const PFX='R|C|L|D|Q|U|IC|F|FU|FUSE|J|P|CN|CON|K|RY|RL|T|TR|TP|SW|S|Y|X|XT|ZD|LED|VR|RV|NTC|PTC|MOV|ZNR|VDR|BD|DB|LF|FB|BZ|BUZ|M|MT|Z|VD|VT|TH|RT|PS|E|EC|CE|CX|CY|H|JP|W|PC|OC|ISO|SCR|BR|SP|MIC|LCD|DS|TVS|ESD|RN|RA|CR|HS|FL|NF|G|B|BT|BAT|A';
const DES=new RegExp('^(?:'+PFX+')\\d{1,4}[A-Z]?$');
const VAL=/^[0-9.,]+\s*[a-zA-Zµ]*$|^\d|[Ωµ]|^\d+(\.\d+)?[pnumkKMRV]/;
const isLabel=s=>s.length<=16&&/[A-Za-z]/.test(s)&&/^[A-Za-z_+\-\/~][\w+\-\/.~()]*$/.test(s)&&!VAL.test(s);

// ---------- reading a page ----------
async function readPage(page){
 const vp=page.getViewport({scale:1}),O=lib.OPS,U=lib.Util;
 const ol=await page.getOperatorList();
 let ctm=vp.transform.slice();const st=[];let sub=[],cur=null;const segs=[];
 const P=(x,y)=>[ctm[0]*x+ctm[2]*y+ctm[4],ctm[1]*x+ctm[3]*y+ctm[5]];
 const add=s=>{
  if(s.closed||s.rect||s.pts.length<2)return;const p=s.pts,n=p.length-1;
  if(n>=4){let dg=0;for(let i=0;i<n;i++){const dx=p[i+1][0]-p[i][0],dy=p[i+1][1]-p[i][1];if(Math.abs(dx)>.3&&Math.abs(dy)>.3)dg++;}if(dg/n>.6)return;}
  for(let i=0;i<n;i++){const a=p[i],b=p[i+1];if(Math.hypot(b[0]-a[0],b[1]-a[1])>=.8)segs.push(a[0],a[1],b[0],b[1]);}
 };
 const flush=ok=>{if(ok)for(const s of sub)add(s);sub=[];cur=null;};
 const F=ol.fnArray,A=ol.argsArray;
 for(let i=0;i<F.length;i++){
  const f=F[i],a=A[i];
  if(f===O.save)st.push(ctm.slice());
  else if(f===O.restore){if(st.length)ctm=st.pop();}
  else if(f===O.transform)ctm=U.transform(ctm,a);
  else if(f===O.paintFormXObjectBegin){st.push(ctm.slice());if(a&&a[0])ctm=U.transform(ctm,a[0]);}
  else if(f===O.paintFormXObjectEnd){if(st.length)ctm=st.pop();}
  else if(f===O.constructPath){
   const ops=a[0],xs=a[1];let j=0;
   for(const op of ops){
    if(op===O.moveTo){cur={pts:[P(xs[j],xs[j+1])]};sub.push(cur);j+=2;}
    else if(op===O.lineTo){if(!cur){cur={pts:[]};sub.push(cur);}cur.pts.push(P(xs[j],xs[j+1]));j+=2;}
    else if(op===O.curveTo||op===O.curveTo2||op===O.curveTo3){const k=op===O.curveTo?6:4;cur={pts:[P(xs[j+k-2],xs[j+k-1])]};sub.push(cur);j+=k;}
    else if(op===O.closePath){if(cur)cur.closed=1;}
    else if(op===O.rectangle){const x=xs[j],y=xs[j+1],w=xs[j+2],h=xs[j+3];j+=4;sub.push({pts:[],rect:1});cur=null;}
   }
  }
  else if(f===O.stroke)flush(1);
  else if(f===O.closeStroke){if(cur)cur.closed=1;flush(1);}
  else if(f===O.fill||f===O.eoFill||f===O.fillStroke||f===O.eoFillStroke||f===O.closeFillStroke||f===O.closeEOFillStroke||f===O.endPath)flush(0);
 }
 const tc=await page.getTextContent(),texts=[];
 for(const it of tc.items){
  const s=it.str;if(!s||!s.trim())continue;
  const t=U.transform(vp.transform,it.transform),fh=Math.hypot(t[2],t[3])||1,fw=Math.hypot(t[0],t[1])||1;
  const dx=t[0]/fw,dy=t[1]/fw,ux=t[2]/fh,uy=t[3]/fh,W=it.width||fh*.6*s.length,L=s.length;
  for(const m of s.matchAll(/\S+/g)){
   const o=m.index/L*W,w=m[0].length/L*W,ox=t[4]+dx*o,oy=t[5]+dy*o,h=fh*.8;
   const xs=[ox,ox+dx*w,ox+ux*h,ox+dx*w+ux*h],ys=[oy,oy+dy*w,oy+uy*h,oy+dy*w+uy*h];
   texts.push([m[0],Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]);
  }
 }
 return {w:vp.width,h:vp.height,segs,texts};
}

// ---------- graph ----------
let PG=[],G=null,NAME='';
function build(pages){
 const NX=[],NY=[],NP=[],EA=[],EB=[],EP=[];const comps={},labs={};
 pages.forEach((pg,pi)=>{
  const s=pg.segs,tol=.9,cell=new Map(),key=(x,y)=>Math.floor(x/2)+','+Math.floor(y/2);
  const base=NX.length;
  const node=(x,y)=>{const cx=Math.floor(x/2),cy=Math.floor(y/2);
   for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const l=cell.get((cx+i)+','+(cy+j));if(l)for(const n of l)if(Math.abs(NX[n]-x)<tol&&Math.abs(NY[n]-y)<tol)return n;}
   const n=NX.length;NX.push(x);NY.push(y);NP.push(pi);const k=key(x,y);(cell.get(k)||cell.set(k,[]).get(k)).push(n);return n;};
  const E=[];
  for(let i=0;i<s.length;i+=4){const a=node(s[i],s[i+1]),b=node(s[i+2],s[i+3]);if(a!==b)E.push([a,b]);}
  // T-junctions: a node lying inside another segment splits it
  const sg=new Map(),C=25;
  E.forEach((e,k)=>{const x0=Math.min(NX[e[0]],NX[e[1]]),x1=Math.max(NX[e[0]],NX[e[1]]),y0=Math.min(NY[e[0]],NY[e[1]]),y1=Math.max(NY[e[0]],NY[e[1]]);
   for(let i=Math.floor(x0/C);i<=Math.floor(x1/C);i++)for(let j=Math.floor(y0/C);j<=Math.floor(y1/C);j++){const kk=i+','+j;(sg.get(kk)||sg.set(kk,[]).get(kk)).push(k);}});
  const splits=new Map();
  for(let n=base;n<NX.length;n++){const l=sg.get(Math.floor(NX[n]/C)+','+Math.floor(NY[n]/C));if(!l)continue;
   for(const k of l){const[a,b]=E[k];if(a===n||b===n)continue;const ax=NX[a],ay=NY[a],vx=NX[b]-ax,vy=NY[b]-ay,L2=vx*vx+vy*vy;
    const t=((NX[n]-ax)*vx+(NY[n]-ay)*vy)/L2;if(t<=0||t>=1)continue;const px=ax+t*vx-NX[n],py=ay+t*vy-NY[n];
    if(px*px+py*py<tol*tol)(splits.get(k)||splits.set(k,[]).get(k)).push([t,n]);}}
  E.forEach((e,k)=>{const sp=splits.get(k);let ch=[e[0]];if(sp){sp.sort((p,q)=>p[0]-q[0]);for(const x of sp)if(ch[ch.length-1]!==x[1])ch.push(x[1]);}ch.push(e[1]);
   for(let i=0;i+1<ch.length;i++)if(ch[i]!==ch[i+1]){EA.push(ch[i]);EB.push(ch[i+1]);EP.push(pi);}});
 });
 const N=NX.length,M=EA.length,adj=Array.from({length:N},()=>[]);
 for(let e=0;e<M;e++){adj[EA[e]].push(e);adj[EB[e]].push(e);}
 const EL=new Float32Array(M);for(let e=0;e<M;e++)EL[e]=Math.hypot(NX[EA[e]]-NX[EB[e]],NY[EA[e]]-NY[EB[e]]);
 // physical nets
 const par=Int32Array.from({length:N},(_,i)=>i);const fd=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x];}return x;};
 for(let e=0;e<M;e++){const a=fd(EA[e]),b=fd(EB[e]);if(a!==b)par[a]=b;}
 const ph=new Int32Array(N);for(let i=0;i<N;i++)ph[i]=fd(i);
 // spatial index of edges per page, for clicks and labels
 const IX=pages.map(()=>new Map()),C=30;
 for(let e=0;e<M;e++){const p=EP[e],a=EA[e],b=EB[e];
  for(let i=Math.floor(Math.min(NX[a],NX[b])/C);i<=Math.floor(Math.max(NX[a],NX[b])/C);i++)for(let j=Math.floor(Math.min(NY[a],NY[b])/C);j<=Math.floor(Math.max(NY[a],NY[b])/C);j++){const k=i+','+j;(IX[p].get(k)||IX[p].set(k,[]).get(k)).push(e);}}
 const dseg=(e,x,y)=>{const a=EA[e],b=EB[e],ax=NX[a],ay=NY[a],vx=NX[b]-ax,vy=NY[b]-ay,L2=vx*vx+vy*vy||1;let t=((x-ax)*vx+(y-ay)*vy)/L2;t=Math.max(0,Math.min(1,t));return Math.hypot(ax+t*vx-x,ay+t*vy-y);};
 const near=(p,x,y,r)=>{let best=-1,bd=r;for(let i=Math.floor((x-r)/C);i<=Math.floor((x+r)/C);i++)for(let j=Math.floor((y-r)/C);j<=Math.floor((y+r)/C);j++){const l=IX[p].get(i+','+j);if(l)for(const e of l){const d=dseg(e,x,y);if(d<bd){bd=d;best=e;}}}return best;};
 // labels and designators
 const lab=[];
 pages.forEach((pg,pi)=>{const seen=new Set();
  for(const[s,x0,y0,x1,y1] of pg.texts){
   const u=s.toUpperCase(),cx=(x0+x1)/2,cy=(y0+y1)/2;
   if(DES.test(u)){if(seen.has(u))continue;seen.add(u);if(!comps[u])comps[u]={id:u,p:pi,b:[x0,y0,x1,y1],pins:[]};continue;}
   if(!isLabel(s))continue;
   const r=Math.max(x1-x0,y1-y0)/2+6,e=near(pi,cx,cy,r);if(e<0)continue;
   const a=EA[e],b=EB[e],n=Math.hypot(NX[a]-cx,NY[a]-cy)<Math.hypot(NX[b]-cx,NY[b]-cy)?a:b;
   (labs[u]||(labs[u]={id:u,nodes:[]})).nodes.push(n);lab.push([pi,cx,cy,u,x0,y0,x1,y1]);}
 });
 // pins = loose wire ends, given to the nearest designator
 const byPage=pages.map(()=>[]);for(const c of Object.values(comps))byPage[c.p].push(c);
 const bd=(b,x,y)=>Math.hypot(Math.max(b[0]-x,0,x-b[2]),Math.max(b[1]-y,0,y-b[3]));
 for(let n=0;n<N;n++){if(adj[n].length!==1)continue;const p=NP[n],x=NX[n],y=NY[n];
  if(lab.some(l=>l[0]===p&&bd([l[4],l[5],l[6],l[7]],x,y)<14))continue;
  let best=null,bdist=70;for(const c of byPage[p]){const d=bd(c.b,x,y);if(d<bdist){bdist=d;best=c;}}
  if(!best){bdist=160;for(const c of byPage[p]){const d=bd(c.b,x,y);if(d<bdist){bdist=d;best=c;}}}
  if(best)best.pins.push(n);}
 // merged nets: physical nets joined by equal label names
 const mp=new Map();const mf=x=>{while(mp.has(x)&&mp.get(x)!==x)x=mp.get(x);return x;};
 for(const L of Object.values(labs)){const r=mf(ph[L.nodes[0]]);for(const n of L.nodes){const q=mf(ph[n]);if(q!==r)mp.set(q,r);}}
 const mg=n=>mf(ph[n]);
 for(const c of Object.values(comps))c.nets=[...new Set(c.pins.map(mg))];
 const netLabels=new Map();for(const L of Object.values(labs)){const m=mg(L.nodes[0]);(netLabels.get(m)||netLabels.set(m,new Set()).get(m)).add(L.id);}
 const netComps=new Map();for(const c of Object.values(comps))for(const m of c.nets)(netComps.get(m)||netComps.set(m,new Set()).get(m)).add(c.id);
 G={NX,NY,NP,EA,EB,EP,EL,adj,ph,mg,comps,labs,lab,near,netLabels,netComps,N,M};
}

// ---------- shortest wire path inside one net ----------
function dijk(starts,m){
 const dist=new Map(),prev=new Map(),h=[];
 const push=(d,n)=>{h.push([d,n]);let i=h.length-1;while(i){const p=(i-1)>>1;if(h[p][0]<=h[i][0])break;[h[p],h[i]]=[h[i],h[p]];i=p;}};
 const pop=()=>{const t=h[0],l=h.pop();if(h.length){h[0]=l;let i=0;for(;;){const a=2*i+1,b=a+1;let s=i;if(a<h.length&&h[a][0]<h[s][0])s=a;if(b<h.length&&h[b][0]<h[s][0])s=b;if(s===i)break;[h[s],h[i]]=[h[i],h[s]];i=s;}}return t;};
 for(const s of starts){dist.set(s,0);push(0,s);}
 while(h.length){const[d,n]=pop();if(d>dist.get(n))continue;
  for(const e of G.adj[n]){const o=G.EA[e]===n?G.EB[e]:G.EA[e],nd=d+G.EL[e];if(!dist.has(o)||nd<dist.get(o)){dist.set(o,nd);prev.set(o,n);push(nd,o);}}}
 return{dist,prev};
}
const trace=(prev,n)=>{const r=[n];while(prev.has(n)){n=prev.get(n);r.push(n);}return r.reverse();};

// ---------- a current path from a typed chain ----------
function route(str){
 const toks=str.split(/\s*(?:->|→|>|,|;)\s*|\s+/).map(s=>s.trim()).filter(Boolean);
 const items=toks.map(t=>{const u=t.toUpperCase();return G.comps[u]?{k:'c',id:u}:G.labs[u]?{k:'l',id:u}:{k:'x',id:t};});
 const pieces=[],steps=items.map(it=>({t:it.id,ok:it.k!=='x'})),msgs=[];
 items.forEach(it=>{if(it.k==='x')msgs.push(`Không thấy "${it.id}" trên sơ đồ.`);});
 const ends=(it,m)=>it.k==='c'?G.comps[it.id].pins.filter(n=>G.mg(n)===m):G.labs[it.id].nodes.filter(n=>G.mg(n)===m);
 const nets=it=>it.k==='c'?G.comps[it.id].nets:[G.mg(G.labs[it.id].nodes[0])];
 let entry=null,entryNet=null;
 for(let i=0;i+1<items.length;i++){
  const A=items[i],B=items[i+1];
  if(A.k==='x'||B.k==='x'){entry=null;entryNet=null;continue;}
  const nb=new Set(nets(B));let common=nets(A).filter(m=>nb.has(m));
  if(common.length>1&&entryNet!=null)common=common.filter(m=>m!==entryNet).concat(common.filter(m=>m===entryNet));
  if(!common.length){msgs.push(`Không thấy dây nối ${A.id} với ${B.id}.`);steps[i].ok=steps[i+1].ok=false;entry=null;entryNet=null;continue;}
  const m=common[0],S=ends(A,m),T=new Set(ends(B,m));
  const r=dijk(S,m);let best=null,bv=1e18;for(const t of T)if(r.dist.has(t)&&r.dist.get(t)<bv){bv=r.dist.get(t);best=t;}
  let segs=[];
  if(best!=null){segs.push(trace(r.prev,best));}
  else{// the two ends sit on wires joined only by a label: go to the label, jump, go on
   const r2=dijk([...T],m);let pick=null,pv=1e18;
   for(const L of Object.values(G.labs))for(const a of L.nodes){if(!r.dist.has(a))continue;for(const b of L.nodes){if(!r2.dist.has(b))continue;const v=r.dist.get(a)+r2.dist.get(b);if(v<pv){pv=v;pick=[a,b,L.id];}}}
   if(!pick){msgs.push(`${A.id} → ${B.id}: không vẽ được đường dây.`);continue;}
   segs.push(trace(r.prev,pick[0]));pieces.push({jump:1,a:pick[0],b:pick[1]});segs.push(trace(r2.prev,pick[1]).reverse());best=segs[1][segs[1].length-1];
   if(G.NP[pick[0]]!==G.NP[pick[1]])msgs.push(`${A.id} → ${B.id} đi qua nhãn ${pick[2]} sang trang ${G.NP[pick[1]]+1}.`);
  }
  const first=segs[0][0];
  if(entry!=null&&A.k==='c'&&entry!==first)pieces.push({jump:1,a:entry,b:first});
  if(segs.length===1)pieces.push({nodes:segs[0]});else{pieces.splice(pieces.length-1,0,{nodes:segs[0]});pieces.push({nodes:segs[1]});}
  entry=best;entryNet=m;
 }
 return{toks,steps,pieces,msgs};
}

// ---------- view ----------
const view=$('view'),stage=$('stage'),cv=$('cv'),im=$('im'),ov=$('ov');
let cur=0,z=1,tx=0,ty=0,PDF=null,IMG={};
const COL=['#0a9ac0','#e0532f','#8a5cf6','#2f9e4f','#d6930a','#d63384'];
let paths=[],focus=-1,selNet=null,spd=3;
const apply=()=>{stage.style.transform=`translate(${tx}px,${ty}px) scale(${z})`;};
function fit(){const P=PG[cur],r=view.getBoundingClientRect();z=Math.min(r.width/P.w,r.height/P.h)*.96;tx=(r.width-P.w*z)/2;ty=(r.height-P.h*z)/2;apply();}
function zoomAt(f,cx,cy){const nz=Math.max(.1,Math.min(60,z*f));tx=cx-(cx-tx)*nz/z;ty=cy-(cy-ty)*nz/z;z=nz;apply();}
async function showPage(i,keep){
 cur=i;$('pg').value=i;const P=PG[i];stage.style.width=P.w+'px';stage.style.height=P.h+'px';ov.setAttribute('viewBox',`0 0 ${P.w} ${P.h}`);
 if(P.img){im.src=P.img;im.hidden=false;cv.hidden=true;}
 else{im.hidden=true;cv.hidden=false;const pg=await PDF.getPage(i+1),k=Math.min(3,3600/Math.max(P.w,P.h)),v=pg.getViewport({scale:k});cv.width=v.width;cv.height=v.height;
  if(showPage.task)try{showPage.task.cancel();}catch(e){}
  showPage.task=pg.render({canvasContext:cv.getContext('2d'),viewport:v});try{await showPage.task.promise;}catch(e){}}
 if(!keep)fit();draw();
}
const pt=n=>G.NX[n].toFixed(2)+' '+G.NY[n].toFixed(2);
function draw(){
 // selected net
 let h='';
 if(selNet!=null){let d='';for(let e=0;e<G.M;e++)if(G.EP[e]===cur&&G.mg(G.EA[e])===selNet)d+=`M${pt(G.EA[e])}L${pt(G.EB[e])}`;
  if(d)h=`<path class="hl glow" stroke="#f0b400" d="${d}"/><path class="hl flow" stroke="#d99a00" d="${d}"/>`;}
 $('gnet').innerHTML=h;
 let g='';
 paths.forEach((p,k)=>{if(focus>=0&&focus!==k)return;let d='',j='',sx=null;
  for(const q of p.r.pieces){
   if(q.jump){if(G.NP[q.a]===cur&&G.NP[q.b]===cur)j+=`M${pt(q.a)}L${pt(q.b)}`;continue;}
   const ns=q.nodes.filter(n=>G.NP[n]===cur);if(ns.length<2)continue;if(sx==null)sx=ns[0];d+='M'+ns.map(pt).join('L');}
  if(d)g+=`<path class="hl glow" stroke="${p.c}" d="${d}"/><path class="hl flow" stroke="${p.c}" d="${d}"/>`;
  if(j)g+=`<path class="hl jump" stroke="${p.c}" d="${j}"/>`;
  if(sx!=null)g+=`<circle cx="${G.NX[sx]}" cy="${G.NY[sx]}" r="${4/z+2}" fill="${p.c}"/>`;});
 $('gpath').innerHTML=g;
 ov.style.setProperty('--t',(2.1/spd)+'s');
}
function mark(b,p){
 const go=async()=>{if(p!==cur)await showPage(p,true);const r=view.getBoundingClientRect(),w=b[2]-b[0],hh=b[3]-b[1];
  z=Math.max(z,Math.min(r.width,r.height)/(Math.max(w,hh)*14));tx=r.width/2-(b[0]+w/2)*z;ty=r.height/2-(b[1]+hh/2)*z;apply();
  const pad=3;$('gmark').innerHTML=`<rect class="cbox" x="${b[0]-pad}" y="${b[1]-pad}" width="${w+2*pad}" height="${hh+2*pad}"/><circle class="ring" cx="${b[0]+w/2}" cy="${b[1]+hh/2}" r="${Math.max(w,hh)*1.6+6}"/>`;draw();};
 go();
}

// ---------- panel ----------
const netName=m=>{const l=G.netLabels.get(m);if(l&&l.size)return[...l].join(' / ');const c=G.netComps.get(m);return c&&c.size?'Net nối '+[...c].slice(0,4).join(', ')+(c.size>4?'…':''):'Net không tên';};
const chip=(t,a)=>`<button data-${a}="${esc(t)}">${esc(t)}</button>`;
function showNet(m){
 selNet=m;draw();const c=[...(G.netComps.get(m)||[])].sort(),L=[...(G.netLabels.get(m)||[])];
 const pages=[...new Set(Array.from({length:G.M},(_,e)=>e).filter(e=>G.mg(G.EA[e])===m).map(e=>G.EP[e]+1))];
 $('it').textContent=netName(m);
 $('info').innerHTML=`<p>${L.length?'Nhãn: <b class="mono">'+L.map(esc).join(', ')+'</b>. ':''}Có ${c.length} linh kiện nối vào${pages.length>1?', nằm trên các trang '+pages.join(', '):''}.</p><div class="chips">${c.map(x=>chip(x,'c')).join('')}</div><div class="row" style="margin-top:8px"><button id="unsel">Bỏ chọn</button></div>`;
 $('unsel').onclick=()=>{selNet=null;draw();$('it').textContent='Thông tin';$('info').innerHTML='<p>Bấm vào một dây trên sơ đồ để xem cả net của nó.</p>';};
}
function showComp(id){
 const c=G.comps[id];if(!c)return;mark(c.b,c.p);
 $('it').textContent=id;
 $('info').innerHTML=`<p>Trang ${c.p+1}. ${c.pins.length?'Nối với '+c.nets.length+' net:':'Chưa tìm được chân của linh kiện này trên dây.'}</p><div class="chips">${c.nets.map(m=>`<button data-n="${m}">${esc(netName(m))}</button>`).join('')}</div>`;
}
function showLab(id){const L=G.labs[id];if(!L)return;const n=L.nodes[0],l=G.lab.find(x=>x[3]===id);if(l)mark([l[4],l[5],l[6],l[7]],l[0]);showNet(G.mg(n));}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-c],button[data-n],button[data-l]');if(!b)return;
 if(b.dataset.c)showComp(b.dataset.c);else if(b.dataset.l)showLab(b.dataset.l);else showNet(+b.dataset.n);});
$('q').addEventListener('input',()=>{const t=$('q').value.trim().toUpperCase();if(!t){$('hits').innerHTML='';return;}
 const cs=Object.keys(G.comps).filter(k=>k.includes(t)).sort((a,b)=>(a===t?-1:0)-(b===t?-1:0)||a.length-b.length).slice(0,24);
 const ls=Object.keys(G.labs).filter(k=>k.includes(t)).slice(0,12);
 $('hits').innerHTML=cs.map(x=>chip(x,'c')).join('')+ls.map(x=>chip(x,'l')).join('')||'<span class="stat">Không thấy.</span>';
 if(G.comps[t])showComp(t);});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){const b=$('hits').querySelector('button');if(b)b.click();}});

function renderPaths(){
 $('plist').innerHTML=paths.length?paths.map((p,k)=>`<div class="pi${focus===k?' on':''}" data-k="${k}"><i style="background:${p.c}"></i><span title="${esc(p.s)}">${esc(p.s)}</span><button data-del="${k}" aria-label="Xoá">Xoá</button></div>`).join('')+(paths.length>1?`<button id="all">${focus>=0?'Hiện tất cả':'Đang hiện tất cả'}</button>`:''):'<p>Chưa có đường nào.</p>';
 const a=$('all');if(a)a.onclick=()=>{focus=-1;renderPaths();draw();};
 try{localStorage.setItem('flow:'+NAME,JSON.stringify(paths.map(p=>p.s)));}catch(e){}
}
$('plist').addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(d){paths.splice(+d.dataset.del,1);focus=-1;renderPaths();draw();return;}
 const it=e.target.closest('.pi');if(it){const k=+it.dataset.k;focus=focus===k?-1:k;renderPaths();showSteps(paths[k].r);$('seq').value=paths[k].s;
  const f=paths[k].r.pieces.find(q=>q.nodes);if(f&&G.NP[f.nodes[0]]!==cur)showPage(G.NP[f.nodes[0]]);else draw();}});
function showSteps(r){$('steps').innerHTML=r.steps.map(s=>`<li class="${s.ok?'ok':'no'}">${esc(s.t)}</li>`).join('');$('msg').textContent=r.msgs.join(' ');}
function addPath(s,quiet){
 s=s.trim();if(!s)return;const r=route(s);if(!quiet)showSteps(r);
 if(!r.pieces.some(q=>q.nodes))return;
 const old=paths.findIndex(p=>p.s===s);if(old>=0)paths.splice(old,1);
 paths.push({s,r,c:COL[paths.length%COL.length]});focus=quiet?-1:paths.length-1;
 if(!quiet){const f=r.pieces.find(q=>q.nodes);if(f&&G.NP[f.nodes[0]]!==cur){renderPaths();showPage(G.NP[f.nodes[0]]);return;}}
 renderPaths();draw();
}
$('go').onclick=()=>addPath($('seq').value);
$('seq').addEventListener('keydown',e=>{if(e.key==='Enter')addPath($('seq').value);});
$('spd').oninput=e=>{spd=+e.target.value;draw();};

// ---------- pointer: pan, zoom, click ----------
const pts=new Map();let moved=0,pinch=null;
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);moved=0;view.classList.add('drag');
 if(pts.size===2){const[a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])};}});
view.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId),n=[e.clientX,e.clientY];pts.set(e.pointerId,n);
 if(pts.size===2&&pinch){const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),r=view.getBoundingClientRect();zoomAt(d/pinch.d,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top);pinch.d=d;moved=99;return;}
 tx+=n[0]-o[0];ty+=n[1]-o[1];moved+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1]);apply();});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)view.classList.remove('drag');
 if(e.type==='pointerup'&&moved<6&&!pts.size)clickAt(e);};
view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
view.addEventListener('wheel',e=>{e.preventDefault();const r=view.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
function clickAt(e){
 const r=view.getBoundingClientRect(),x=(e.clientX-r.left-tx)/z,y=(e.clientY-r.top-ty)/z;
 const c=Object.values(G.comps).find(c=>c.p===cur&&x>=c.b[0]-2&&x<=c.b[2]+2&&y>=c.b[1]-2&&y<=c.b[3]+2);
 if(c){if($('pick').checked){const s=$('seq');s.value=(s.value.trim()+' '+c.id).trim();}showComp(c.id);return;}
 const l=G.lab.find(l=>l[0]===cur&&x>=l[4]-2&&x<=l[6]+2&&y>=l[5]-2&&y<=l[7]+2);
 if(l&&$('pick').checked){const s=$('seq');s.value=(s.value.trim()+' '+l[3]).trim();}
 const ed=G.near(cur,x,y,8/z+1.5);
 if(ed>=0)showNet(G.mg(G.EA[ed]));
}
$('zi').onclick=()=>{const r=view.getBoundingClientRect();zoomAt(1.4,r.width/2,r.height/2);};
$('zo').onclick=()=>{const r=view.getBoundingClientRect();zoomAt(1/1.4,r.width/2,r.height/2);};
$('zf').onclick=fit;
$('pg').onchange=e=>{$('gmark').innerHTML='';showPage(+e.target.value);};
addEventListener('resize',()=>{clearTimeout(fit.h);fit.h=setTimeout(fit,200);});
$('new').onclick=()=>{if(!lib){toast('Bản lưu này chỉ để xem. Mở file công cụ gốc để đọc PDF khác.');return;}location.hash='';$('app').hidden=true;$('drop').hidden=false;$('prog').textContent='';$('file').value='';};

// ---------- loading ----------
function score(p){let d=0,v=0;for(const t of p.texts){if(DES.test(t[0].toUpperCase()))d++;else if(/^\d/.test(t[0]))v++;}return{d,v};}
async function start(pages,name,saved){
 PG=pages;NAME=name;build(PG);
 const sc=PG.map(score);let best=0;sc.forEach((s,i)=>{if(s.d+s.v*.5>sc[best].d+sc[best].v*.5)best=i;});
 $('pg').innerHTML=PG.map((p,i)=>`<option value="${i}">Trang ${i+1}${p.skip?' · bỏ qua':' · '+sc[i].d+' linh kiện'}</option>`).join('');
 $('nm').textContent=name;$('drop').hidden=true;$('app').hidden=false;
 const nc=Object.keys(G.comps).length,np=Object.values(G.comps).filter(c=>c.pins.length).length,nl=Object.keys(G.labs).length;
 $('stat').textContent=`Đọc được ${G.M} đoạn dây, ${nc} linh kiện (${np} tìm được chân), ${nl} tên nhãn.`;
 paths=[];focus=-1;selNet=null;
 let list=saved;if(!list){try{list=JSON.parse(localStorage.getItem('flow:'+name)||'[]');}catch(e){list=[];}}
 for(const s of list)addPath(s,true);
 renderPaths();await showPage(best);
 if(!nc)toast('Không thấy chữ tên linh kiện trong PDF (có thể chữ được vẽ bằng nét). Vẫn bấm vào dây để xem net được.');
 else if(G.M<20)toast('PDF này gần như không có nét dây vector, có thể là ảnh scan.');
}
async function openFile(f){
 if(!lib)return;
 const pr=$('prog');pr.textContent='Đang mở file…';
 try{
  PDF=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
  const pages=[];
  for(let i=1;i<=PDF.numPages;i++){pr.textContent=`Đang đọc trang ${i}/${PDF.numPages}…`;
   const pg=await PDF.getPage(i);let r=await readPage(pg);
   if(r.segs.length>4*80000){r={w:r.w,h:r.h,segs:[],texts:r.texts,skip:1};}
   pages.push(r);}
  await start(pages,f.name.replace(/\.pdf$/i,''));
 }catch(err){console.error(err);pr.textContent='Không mở được file này: '+(err&&err.message||err);}
}
const dz=$('dz');
$('file').onchange=e=>{const f=e.target.files[0];if(f)openFile(f);};
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();dz.classList.add('over');}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('over');}));
document.addEventListener('drop',e=>{const f=[...(e.dataTransfer?.files||[])].find(f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf');if(f)openFile(f);});

// ---------- save a standalone HTML ----------
$('exp').onclick=async()=>{
 const keep=PG.map((p,i)=>i).filter(i=>!PG[i].skip&&(score(PG[i]).d>=2||i===cur));
 toast('Đang tạo file HTML…');
 const out=[];
 for(const i of PG.map((p,i)=>i)){
  const P=PG[i];let img=P.img||'';
  if(!img&&keep.includes(i)&&PDF){const pg=await PDF.getPage(i+1),k=Math.min(2.5,3000/Math.max(P.w,P.h)),v=pg.getViewport({scale:k}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;
   const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:v}).promise;img=c.toDataURL('image/jpeg',.88);}
  out.push(keep.includes(i)?{w:P.w,h:P.h,img,segs:P.segs.map(v=>Math.round(v*100)/100),texts:P.texts.map(t=>[t[0],...t.slice(1).map(v=>Math.round(v*100)/100)])}:{w:P.w,h:P.h,segs:[],texts:[],skip:1});
 }
 const data=JSON.stringify({name:NAME,pages:out,paths:paths.map(p=>p.s)}).replace(/</g,'\\u003c');
 const html2=SRC.replace('<body>',()=>'<body>\n<script id="preload">window.PRELOAD='+data+';<\/script>');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html2],{type:'text/html'}));a.download=NAME+' - dong dien.html';document.body.appendChild(a);a.click();a.remove();
 toast('Đã lưu "'+NAME+' - dong dien.html". Nếu trình duyệt chặn tải về, hãy mở công cụ từ file trên máy.');
};

if(window.PRELOAD){const D=window.PRELOAD;start(D.pages,D.name,D.paths);}
}
