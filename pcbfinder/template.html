<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ component finder</title>
<style>
:root{
  /* layout: search rail on the left, the board fills the rest; one screen, no page scroll */
  --bg:#eef1ee; --panel:#ffffff; --ink:#16211b; --muted:#5d6b63; --line:#cfd8d2;
  --accent:#0b7a3b; --accent-ink:#ffffff; --hit:#e4002b; --hint:#0057d9; --warn:#8a4b00; --warn-bg:#fff3dc; --paper:#ffffff;
  --mono:"Cascadia Mono",Consolas,"IBM Plex Mono",ui-monospace,monospace; --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101613; --panel:#18211c; --ink:#e6eee9; --muted:#93a39a; --line:#2c3a32;
    --accent:#3ecf7c; --accent-ink:#06210f; --hit:#ff3355; --hint:#4d9bff; --warn:#ffc266; --warn-bg:#3a2c12; --paper:#f4f6f4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101613; --panel:#18211c; --ink:#e6eee9; --muted:#93a39a; --line:#2c3a32;
  --accent:#3ecf7c; --accent-ink:#06210f; --hit:#ff3355; --hint:#4d9bff; --warn:#ffc266; --warn-bg:#3a2c12; --paper:#f4f6f4;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);display:grid;grid-template-columns:310px 1fr;grid-template-rows:100%;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
h1{font:600 15px/1.25 var(--sans);margin:0}
h1 small{display:block;font:400 12px var(--mono);color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
#q{width:100%;padding:10px 12px;border:2px solid var(--accent);border-radius:6px;background:var(--bg);font:500 16px var(--mono)}
.hint{font-size:12px;color:var(--muted);margin:0}
.count{font:12px var(--mono);color:var(--muted);padding:6px 16px;border-bottom:1px solid var(--line)}
#list{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
#list li button{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:baseline;width:100%;text-align:left;padding:7px 16px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
#list li button:hover{background:var(--bg)}
#list li button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
#list li button[aria-current="true"] .d,#list li button[aria-current="true"] .sd{color:inherit;opacity:.85}
.nm{font:600 14px var(--mono)}
.d{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.sd{font:11px var(--mono);color:var(--muted);text-transform:uppercase}
.sd.miss{color:var(--hit)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.zoom{margin-left:auto;display:inline-flex;gap:6px}
.zoom button{border:1px solid var(--line);background:none;border-radius:6px;padding:6px 10px;cursor:pointer;font:500 13px var(--mono)}
#view{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg);cursor:grab;touch-action:none}
#view.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--paper);box-shadow:0 1px 8px rgba(0,0,0,.25)}
#stage img{display:block;user-select:none;-webkit-user-drag:none}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.hl{fill:var(--hit);fill-opacity:.22;stroke:var(--hit);vector-effect:non-scaling-stroke;stroke-width:2.5}
.sel{fill:var(--hit);fill-opacity:.18;stroke:var(--hit);vector-effect:non-scaling-stroke;stroke-width:3.5}
.ring{fill:none;stroke:var(--hit);vector-effect:non-scaling-stroke;stroke-width:3}
.cross{stroke:var(--hit);vector-effect:non-scaling-stroke;stroke-width:1;stroke-dasharray:6 5;opacity:.7}
.ol{fill:none;stroke:var(--hint);vector-effect:non-scaling-stroke;stroke-width:2;stroke-dasharray:5 4}
@media (prefers-reduced-motion:no-preference){.ring{animation:pulse 1.2s ease-out infinite}}
@keyframes pulse{0%{stroke-opacity:1}100%{stroke-opacity:.15}}
#card{position:absolute;right:16px;bottom:16px;width:min(350px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--hit);border-radius:6px;padding:12px 14px;box-shadow:0 4px 18px rgba(0,0,0,.22)}
#card h2{margin:0 0 6px;font:600 20px var(--mono)}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}
#card dt{color:var(--muted)}
#card dd{margin:0;overflow-wrap:anywhere}
.pill{display:inline-block;font:500 11px var(--mono);padding:2px 7px;border-radius:99px;border:1px solid var(--line);margin-left:8px;vertical-align:middle;text-transform:uppercase}
.note{margin:8px 0 0;padding:6px 8px;border-radius:4px;background:var(--warn-bg);color:var(--warn);font-size:12px}
.key{margin:8px 0 0;font-size:12px;color:var(--muted)}
.key i{display:inline-block;width:18px;height:10px;vertical-align:middle;margin-right:4px}
.empty{padding:16px;color:var(--muted)}
#schnav{display:none;gap:6px;align-items:center;font:12px var(--mono)}
#schnav button{border:1px solid var(--line);background:none;border-radius:6px;padding:4px 9px;cursor:pointer}
@media (max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:40% 60%}
  .rail{border-right:0;border-bottom:1px solid var(--line)}
  #card{left:16px;right:16px;width:auto;bottom:8px}
}
</style>
</head>
<body>
<aside class="rail">
  <div class="head">
    <h1>Component finder<small id="ttl"></small></h1>
    <input id="q" type="search" placeholder="R12, C5, TP33, 100nF…" autocomplete="off" spellcheck="false" aria-label="Search component">
    <p class="hint">Type a designator, a value or a part number. Enter jumps to the first match. Click a label on the board to see what it is.</p>
  </div>
  <div class="count" id="count"></div>
  <ul id="list"></ul>
</aside>
<main class="main">
  <div class="bar">
    <div class="seg" role="group" aria-label="View">
      <button id="m-draw" aria-pressed="true">Board drawing</button>
      <button id="m-photo" aria-pressed="false">Real photo</button>
      <button id="m-sch" aria-pressed="false">Schematic</button>
    </div>
    <div class="seg" role="group" aria-label="Board side" id="sides">
      <button id="s-0" aria-pressed="true">Top side</button>
      <button id="s-1" aria-pressed="false">Bottom side</button>
    </div>
    <div id="schnav"><button id="sp" aria-label="Previous">◀</button><span id="spos"></span><button id="sn" aria-label="Next">▶</button></div>
    <div class="zoom">
      <button id="zo" aria-label="Zoom out">−</button>
      <button id="zi" aria-label="Zoom in">+</button>
      <button id="zf">Whole board</button>
    </div>
  </div>
  <div id="view">
    <div id="stage"><img id="img" alt="Board view" draggable="false"><svg id="ov" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="card" hidden></div>
  </div>
</main>
<script>
/*__DATA__*/
const $=id=>document.getElementById(id);
const view=$('view'),stage=$('stage'),img=$('img'),ov=$('ov'),card=$('card'),list=$('list'),q=$('q');
const SIDES=Object.keys(META.sides),SCH=META.sch||[];
let mode='draw',side=SIDES[0],schPage=SCH[0]||0,schIdx=0,sel=[],cur=null,T={x:0,y:0,k:1},IW=1,IH=1;
$('ttl').textContent=META.title;
const hasPhoto=s=>!!IMGS['photo_'+s];
if(!SIDES.some(hasPhoto)) $('m-photo').style.display='none';
if(!SCH.length) $('m-sch').style.display='none';
if(SIDES.length<2) $('sides').style.display='none';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function norm(s){return s.toLowerCase().replace(/[\s,]+/g,'').replace(/[µμ]/g,'u').replace(/ω/g,'ohm')}
const IDX=COMPS.map(c=>({c,name:c.n.toLowerCase(),text:c.b?norm([c.b.comp,c.b.pkg,c.b.desc,c.b.pn,c.b.mfr].join(' ')):''}));
function search(s){
  s=s.trim(); if(!s) return COMPS.filter(c=>!c.miss).concat(COMPS.filter(c=>c.miss));
  const n=s.toLowerCase(),t=norm(s);
  const exact=IDX.filter(i=>i.name===n),pre=IDX.filter(i=>i.name!==n&&i.name.startsWith(n)),
        txt=IDX.filter(i=>!i.name.startsWith(n)&&t.length>1&&i.text.includes(t));
  return [...exact,...pre,...txt].map(i=>i.c);
}
function imgKey(){if(mode==='photo'&&!hasPhoto(side))mode='draw';return mode==='draw'?'draw_'+side:mode==='photo'?'photo_'+side:'sch_'+schPage}
function setImage(){
  const I=IMGS[imgKey()]; IW=I.w; IH=I.h;
  if(img.getAttribute('src')!==I.src) img.src=I.src;
  img.width=I.w; img.height=I.h; stage.style.width=I.w+'px'; stage.style.height=I.h+'px';
  ov.setAttribute('viewBox',`0 0 ${I.w} ${I.h}`);
  $('m-draw').setAttribute('aria-pressed',mode==='draw'); $('m-photo').setAttribute('aria-pressed',mode==='photo'); $('m-sch').setAttribute('aria-pressed',mode==='sch');
  $('s-0').setAttribute('aria-pressed',side===SIDES[0]); $('s-1').setAttribute('aria-pressed',side===SIDES[1]);
  $('sides').style.display=(mode==='sch'||SIDES.length<2)?'none':''; $('schnav').style.display=mode==='sch'?'inline-flex':'none';
}
function apply(){stage.style.transform=`translate(${T.x}px,${T.y}px) scale(${T.k})`}
function fitK(){return Math.min((view.clientWidth-48)/IW,(view.clientHeight-48)/IH)}
function fitBox(x0,y0,x1,y1){const W=view.clientWidth,H=view.clientHeight,k=Math.min((W-48)/(x1-x0),(H-48)/(y1-y0));T.k=k;T.x=W/2-(x0+x1)/2*k;T.y=H/2-(y0+y1)/2*k;apply()}
function fitAll(){fitBox(0,0,IW,IH)}
/* the printed label of a component in the current view */
function shape(c){
  if(c.miss||c.s!==side) return null;
  if(mode==='draw'){const r=c.r;return {pts:[[r[0],r[1]],[r[2],r[1]],[r[2],r[3]],[r[0],r[3]]],box:r}}
  if(mode==='photo'&&c.q){const xs=c.q.map(p=>p[0]),ys=c.q.map(p=>p[1]);return {pts:c.q,box:[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}}
  return null;
}
function poly(cls,pts,pad){
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  if(pad){const x0=Math.min(...xs)-pad,y0=Math.min(...ys)-pad,x1=Math.max(...xs)+pad,y1=Math.max(...ys)+pad;return `<rect class="${cls}" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="${pad/2}"/>`}
  return `<polygon class="${cls}" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
}
function draw(){
  let h='';
  if(mode==='sch'){
    if(cur&&cur.sch) cur.sch.filter(s=>s[0]===schPage).forEach(s=>{
      const cx=(s[1]+s[3])/2,cy=(s[2]+s[4])/2;
      h+=`<rect class="hl" x="${s[1]-4}" y="${s[2]-3}" width="${s[3]-s[1]+8}" height="${s[4]-s[2]+6}"/><circle class="ring" cx="${cx}" cy="${cy}" r="46"/>`;});
  }else{
    const pad=mode==='draw'?Math.max(3,IW*0.0025):3;
    sel.forEach(c=>{const s=shape(c);if(s&&c!==cur)h+=poly('hl',s.pts,pad)});
    if(cur){const s=shape(cur); if(s){
      const b=s.box,cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2,r=Math.max(b[2]-b[0],b[3]-b[1])/2+IW*0.025;
      if(mode==='draw'&&cur.o){const o=cur.o;h+=`<rect class="ol" x="${o[0]}" y="${o[1]}" width="${o[2]-o[0]}" height="${o[3]-o[1]}"/>`}
      h+=`<line class="cross" x1="0" y1="${cy}" x2="${IW}" y2="${cy}"/><line class="cross" x1="${cx}" y1="0" x2="${cx}" y2="${IH}"/>`;
      h+=poly('sel',s.pts,pad)+`<circle class="ring" cx="${cx}" cy="${cy}" r="${r}"/>`;
    }}
  }
  ov.innerHTML=h;
}
function where(c){
  const fx=c.f[0],fy=c.f[1],v=fy<.34?'top':fy>.66?'bottom':'middle',hz=fx<.34?'left':fx>.66?'right':'centre';
  return (v==='middle'&&hz==='centre')?'centre of the board':`${v} ${hz}`;
}
function showCard(c){
  if(!c){card.hidden=true;return}
  const b=c.b; let h=`<h2>${esc(c.n)}${c.s?`<span class="pill">${c.s} side</span>`:''}</h2><dl>`;
  if(b){h+=`<dt>Part</dt><dd>${esc(b.comp)}</dd><dt>Value</dt><dd>${esc(b.desc)}</dd>`+(b.pkg?`<dt>Package</dt><dd>${esc(b.pkg)}</dd>`:'')+`<dt>P/N</dt><dd>${esc(b.mfr)} ${esc(b.pn)}</dd><dt>BOM</dt><dd>item ${esc(b.item)}, PDF page ${esc(b.page)}</dd>`}
  else if(/^TP/i.test(c.n)) h+=`<dt>Part</dt><dd>Test point</dd>`;
  else if(Object.keys(BOMINFO).length) h+=`<dt>Part</dt><dd>Printed on the board, not in the BOM (probably not fitted)</dd>`;
  if(!c.miss){
    const mm=META.sides[c.s].mm,pos=mm?`${(c.f[0]*mm[0]).toFixed(1)} mm from the left edge, ${(c.f[1]*mm[1]).toFixed(1)} mm from the top edge`:`${Math.round(c.f[0]*100)}% across from the left, ${Math.round(c.f[1]*100)}% down from the top`;
    h+=`<dt>Where</dt><dd>${where(c)}: ${pos} (as drawn on PDF page ${META.sides[c.s].page})</dd>`;
  }
  if(c.sch) h+=`<dt>Schematic</dt><dd>PDF page ${[...new Set(c.sch.map(s=>s[0]))].join(', ')}</dd>`;
  h+='</dl>';
  if(c.miss) h+=`<p class="note">This part is in the BOM, but its label was not found on the board drawing.${c.sch?' Use the Schematic view to see it in the circuit.':''}</p>`;
  else if(c.dup) h+=`<p class="note">This name was read in more than one place. Both places are marked; look at the board to see which one says ${esc(c.n)}.</p>`;
  else if(mode==='draw') h+=`<p class="key"><i style="background:color-mix(in srgb,var(--hit) 25%,transparent);border:2px solid var(--hit)"></i>the printed name`+(c.o?` &nbsp; <i style="border:2px dashed var(--hint)"></i>the part next to it`:'')+`</p>`;
  if(mode==='photo'&&!c.q&&!c.miss) h+=`<p class="note">No photo is available for this side.</p>`;
  if(mode==='sch'&&!c.sch) h+=`<p class="note">This name was not found on the schematic pages.</p>`;
  card.innerHTML=h; card.hidden=false;
}
const BOMINFO=Object.fromEntries(COMPS.filter(c=>c.b).map(c=>[c.n,1]));
function focusCur(){
  if(!cur) return;
  if(mode==='sch'){
    if(!cur.sch){draw();return}
    schIdx=Math.min(schIdx,cur.sch.length-1); const s=cur.sch[schIdx]; schPage=s[0]; setImage();
    $('spos').textContent=`page ${schPage} · ${schIdx+1}/${cur.sch.length}`;
    const cx=(s[1]+s[3])/2,cy=(s[2]+s[4])/2,w=IW*0.3,hh=w*view.clientHeight/view.clientWidth;
    fitBox(cx-w/2,cy-hh/2,cx+w/2,cy+hh/2); draw(); return;
  }
  if(cur.miss){draw();return}
  side=cur.s; setImage();
  const s=shape(cur); if(!s){fitAll();draw();return}
  const b=s.box,cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2,k=fitK()*3;
  T.k=k; T.x=view.clientWidth/2-cx*k; T.y=view.clientHeight/2-cy*k; apply(); draw();
}
function select(c){
  cur=c; schIdx=0;
  const same=COMPS.filter(x=>x.n===c.n&&!x.miss); if(!sel.includes(c)) sel=same.length?same:[c];
  showCard(c); focusCur();
  list.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.i===String(COMPS.indexOf(c))));
  const a=list.querySelector('button[aria-current="true"]'); if(a) a.scrollIntoView({block:'nearest'});
}
function renderList(items,typed){
  const onb=COMPS.filter(c=>!c.miss).length;
  $('count').textContent=typed?`${items.length} match${items.length===1?'':'es'}`:`${onb} labels on the board`+(COMPS.length>onb?` · ${COMPS.length-onb} BOM parts not found`:'');
  if(!items.length){list.innerHTML=`<li class="empty">Nothing matches “${esc(q.value)}”.</li>`;return}
  list.innerHTML=items.map(c=>`<li><button data-i="${COMPS.indexOf(c)}"><span class="nm">${esc(c.n)}</span><span class="d">${c.b?esc(c.b.desc):(/^TP/i.test(c.n)?'test point':'')}</span><span class="sd${c.miss?' miss':''}">${c.miss?'not found':c.s==='top'?'top':'bot'}</span></button></li>`).join('');
}
list.addEventListener('click',e=>{const b=e.target.closest('button');if(b)select(COMPS[+b.dataset.i])});
q.addEventListener('input',()=>{
  const typed=q.value.trim()!=='',items=search(q.value); renderList(items,typed);
  sel=typed?items.filter(c=>!c.miss).slice(0,80):[]; cur=null; showCard(null);
  const one=new Set(items.map(c=>c.n)).size===1;
  if(typed&&items.length&&one){select(items[0]);return}
  if(typed&&sel.length&&mode!=='sch'){if(!sel.some(c=>c.s===side)){side=sel[0].s;setImage()} fitAll()}
  draw();
});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const it=search(q.value);if(it.length){const keep=sel;select(it[0]);if(keep.includes(it[0]))sel=keep;draw()}}});
function setMode(m){mode=m;setImage();if(cur){showCard(cur);focusCur()}else{fitAll();draw()}}
$('m-draw').onclick=()=>setMode('draw'); $('m-photo').onclick=()=>setMode('photo'); $('m-sch').onclick=()=>setMode('sch');
function setSide(s){if(!s)return;side=s;setImage();fitAll();draw()}
$('s-0').onclick=()=>setSide(SIDES[0]); $('s-1').onclick=()=>setSide(SIDES[1]);
function schStep(d){
  if(cur&&cur.sch){schIdx=(schIdx+d+cur.sch.length)%cur.sch.length;focusCur()}
  else{const i=(SCH.indexOf(schPage)+d+SCH.length)%SCH.length;schPage=SCH[i];setImage();$('spos').textContent=`page ${schPage}`;fitAll();draw()}
}
$('sp').onclick=()=>schStep(-1); $('sn').onclick=()=>schStep(1);
function zoomAt(f,px,py){const k=Math.max(fitK()*0.5,Math.min(T.k*f,fitK()*20));T.x=px-(px-T.x)*k/T.k;T.y=py-(py-T.y)*k/T.k;T.k=k;apply()}
$('zi').onclick=()=>zoomAt(1.5,view.clientWidth/2,view.clientHeight/2);
$('zo').onclick=()=>zoomAt(1/1.5,view.clientWidth/2,view.clientHeight/2);
$('zf').onclick=fitAll;
view.addEventListener('wheel',e=>{e.preventDefault();const r=view.getBoundingClientRect();zoomAt(e.deltaY<0?1.2:1/1.2,e.clientX-r.left,e.clientY-r.top)},{passive:false});
const P=new Map();let moved=0,pd=0;
view.addEventListener('pointerdown',e=>{if(e.target.closest('#card'))return;view.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);moved=0;view.classList.add('drag')});
view.addEventListener('pointermove',e=>{
  if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);
  if(P.size===1){T.x+=e.clientX-o[0];T.y+=e.clientY-o[1];moved+=Math.abs(e.clientX-o[0])+Math.abs(e.clientY-o[1]);apply()}
  P.set(e.pointerId,[e.clientX,e.clientY]);
  if(P.size===2){const [a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),r=view.getBoundingClientRect();if(pd)zoomAt(d/pd,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top);pd=d;moved=99}
});
function up(e){
  if(!P.has(e.pointerId))return;P.delete(e.pointerId);pd=0;view.classList.remove('drag');
  if(moved<5&&mode!=='sch'){
    const r=view.getBoundingClientRect(),x=(e.clientX-r.left-T.x)/T.k,y=(e.clientY-r.top-T.y)/T.k,pad=6/T.k;
    let best=null,bd=1e18;
    COMPS.forEach(c=>{const s=shape(c);if(!s)return;const b=s.box;
      const dx=Math.max(b[0]-x,0,x-b[2]),dy=Math.max(b[1]-y,0,y-b[3]),d=Math.hypot(dx,dy);
      if(d<=pad+2/T.k&&d<bd){bd=d;best=c}});
    if(best){const k=T.k,tx=T.x,ty=T.y;sel=[best];cur=best;showCard(best);draw();T.k=k;T.x=tx;T.y=ty;apply();
      list.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.i===String(COMPS.indexOf(best))))}
  }
}
view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
window.addEventListener('resize',()=>{cur?focusCur():fitAll()});
renderList(search(''),false); setImage(); fitAll(); draw(); $('spos').textContent='page '+schPage;
</script>
